name: GraniteShares
description: >-
  GraniteShares is an independent exchange-traded fund (ETF) issuer that builds
  alternative, single-stock and thematic investment products for investors who
  want differentiated exposure. Its lineup spans 2x leveraged and inverse
  single-stock ETFs (such as NVDL for NVIDIA and TSLR for Tesla), YieldBOOST
  options-income ETFs, autocallable ETFs, physically-backed gold and broad
  commodity ETFs, and diversified income and equity strategies across U.S. and
  European markets. GraniteShares publishes no public developer or data API
  program; this API Evangelist profile catalogs the company's public web surface
  and the machine-readable discovery documents (OpenID Connect / OAuth 2.0
  member authentication for its Umbraco-powered site) that were probed from its
  domain. It was surfaced as a portfolio company of Bain Capital Ventures.
